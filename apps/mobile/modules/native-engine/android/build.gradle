plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.vivavoz'
version = '1.0.0'

android {
  namespace "expo.modules.nativeengine"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    externalNativeBuild {
      cmake {
        cppFlags ""
        arguments "-DANDROID_STL=none"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
  // The weights fetched by scripts/fetch-native-deps.sh ship inside the app; nothing is downloaded at runtime.
  // Play Store bundles (ECO_ASSET_PACKS=1) carry them in install-time asset packs instead of the base module
  // (plugins/withModelAssetPacks.js), which Play caps at 500 MB.
  if (System.getenv("ECO_ASSET_PACKS") != "1") {
    sourceSets {
      main {
        assets.srcDirs += ["${projectDir}/../../../assets/models"]
      }
    }
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
