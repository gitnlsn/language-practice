plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.vivavoz'
version = '1.0.0'

android {
  namespace "expo.modules.playbilling"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Google Play Billing; its manifest adds the com.android.vending.BILLING permission Play Console looks for.
  implementation 'com.android.billingclient:billing-ktx:9.1.0'
}
